<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tauschordner 30th Celebration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#E8ECF3; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#161A2C; --muted:#5E6582; --line:#D4D9E5;
  --a:#2A62E0; --a-soft:#E4ECFD; --b:#D02F69; --b-soft:#FCE5EE;
  --swap:#11845A; --swap-soft:#DCF3E8; --spark:#E0A800; --err:#C4302B;
  --display:"Chakra Petch","Bahnschrift","Arial Narrow",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --cellw:70px; --thumbw:60px; --gap:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1220; --surface:#171B2B; --surface-2:#1E2336; --ink:#E7E9F3; --muted:#9AA1BD; --line:#2B3148;
    --a:#7AA2FF; --a-soft:#1B2747; --b:#FF76A3; --b-soft:#3A1D2A; --swap:#44CC92; --swap-soft:#16322A; --err:#FF7B72;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 12px 48px}

header.top{padding:18px 4px 10px}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 1.65rem/1.05 var(--display);margin:0;letter-spacing:.01em}
h1 small{display:block;font:600 .95rem/1.3 var(--body);color:var(--muted);margin-top:4px;letter-spacing:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync[data-mode="live"] i{background:var(--swap)}
.sync[data-mode="polling"] i{background:var(--spark)}
.sync[data-mode="error"] i{background:var(--err)}
.sync[data-mode="error"]{color:var(--err)}

.me{display:flex;flex-direction:column;gap:4px}
.me span{font-size:.78rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"][data-p="a"]{background:var(--a);color:#fff}
.seg button[aria-pressed="true"][data-p="b"]{background:var(--b);color:#fff}

.progress{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.prog{background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.prog .who{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prog .who b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .who em{font:600 1.05rem var(--display);font-style:normal;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin:7px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .3s ease}
.prog[data-p="a"] .bar i{background:var(--a)} .prog[data-p="b"] .bar i{background:var(--b)}
.prog .sub{font-size:.78rem;color:var(--muted)}

.tradeline{margin-top:10px;width:100%;text-align:left;border:1px dashed var(--swap);background:var(--swap-soft);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.92rem}
.tradeline b{color:var(--swap)}

.search{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;font-size:.95rem;color:var(--ink)}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.setrow input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;width:130px}
.btn{border:0;border-radius:8px;padding:8px 12px;background:var(--ink);color:var(--surface);font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:6px -12px 0;padding:8px 12px 0}
.row-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.row-scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.pika{border-color:#D9A800;background:#FFF4C2;color:#5B4500}
.chip.pika[aria-pressed="true"]{background:#F2C230;color:#2A2000;border-color:#C79B00}
.chip .n{font-weight:600;opacity:.7;margin-left:3px}
.status .chip{font-weight:600}
.status .chip[aria-pressed="true"]{background:var(--swap);border-color:var(--swap);color:#fff}

.colhead,.card{display:grid;grid-template-columns:var(--thumbw) minmax(0,1fr) var(--cellw) var(--cellw);gap:var(--gap)}
.colhead{align-items:end;padding:6px 10px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.colhead .nm{text-align:center;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px 6px 0 0;padding:3px 2px}
.colhead .nm[data-p="a"]{color:var(--a)} .colhead .nm[data-p="b"]{color:var(--b)}
.colhead .nm.mine[data-p="a"]{background:var(--a-soft)} .colhead .nm.mine[data-p="b"]{background:var(--b-soft)}

.sec{font:700 1.05rem var(--display);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec[hidden]{display:none}
.sec span{font:600 .8rem var(--body);color:var(--muted);text-align:right}
.card{align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px;margin-bottom:6px;border:1px solid transparent}
.card.miss-both{border-color:var(--line);background:var(--surface-2)}
.card[hidden]{display:none}

/* Card image, with a type-coloured foil tile as placeholder and fallback */
.thumb{position:relative;display:block;width:var(--thumbw);aspect-ratio:63/88;border-radius:4px;overflow:hidden;border:0;padding:0;cursor:zoom-in;
  background:linear-gradient(150deg,var(--t1) 0%,var(--t1) 45%,var(--t2) 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
div.thumb{cursor:default}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.thumb.loaded img{opacity:1}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.5) 44%,transparent 58%)}
.thumb b{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:700 .7rem/1 var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);z-index:1}
.thumb.loaded::after,.thumb.loaded::before,.thumb.loaded b{display:none}
.g-energy .thumb::before{content:"";position:absolute;left:50%;top:40%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid rgba(255,255,255,.9);z-index:1}
.g-promo .thumb{background:linear-gradient(150deg,#8B7BD8,#4A3F8F)}

.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.info h3{margin:0;font-size:.95rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.info .meta{font-size:.74rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:.68rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.tag[hidden]{display:none}
.tag.r-pika{background:#FFF1B8;color:#5B4500}
.tag.r-dr,.tag.r-rare{background:#E9E6FF;color:#3E2F9E}
.tag.r-ir,.tag.r-sir,.tag.r-fur,.tag.r-rgb{background:#FFE3F1;color:#8A1454}
.tag.r-cc{background:#FFF6CF;color:#6B5200}
.tag.trade{background:var(--swap-soft);color:var(--swap)}
.tag.upcoming{background:#FFE3A8;color:#6B4A00}
@media (prefers-color-scheme:dark){.tag[class*="r-"]{background:var(--surface-2);color:var(--ink)}.tag.upcoming{background:#4A3A12;color:#FFCE7A}}

.cell{--pc:var(--a);--pcs:var(--a-soft);align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px;padding:4px 2px;margin:-4px 0}
.cell[data-p="b"]{--pc:var(--b);--pcs:var(--b-soft)}
.cell.mine{background:var(--pcs)}
.have{width:36px;height:36px;border-radius:10px;border:2px solid var(--pc);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.have svg{width:20px;height:20px;opacity:0;stroke:#fff}
.have[aria-pressed="true"]{background:var(--pc)}
.have[aria-pressed="true"] svg{opacity:1}
.cell:not(.mine) .have{width:28px;height:28px;border-radius:50%;border-style:dashed;border-width:1.5px;opacity:.75;cursor:help}
.cell:not(.mine) .have[aria-pressed="true"]{border-style:solid;opacity:1}
.cell:not(.mine) .have svg{width:15px;height:15px}
.dupadd{border:1px solid var(--pc);color:var(--pc);background:var(--surface);border-radius:999px;font-size:.68rem;font-weight:800;padding:2px 7px;cursor:pointer;line-height:1.4}
.stepper{display:flex;align-items:center;background:var(--pc);color:#fff;border-radius:999px;overflow:hidden}
.stepper button{border:0;background:none;color:#fff;width:22px;height:22px;font-weight:800;cursor:pointer;padding:0;font-size:1rem;line-height:1}
.stepper output{font:700 .76rem var(--display);min-width:18px;text-align:center}
.rodup{font-size:.68rem;font-weight:800;color:var(--pc);text-align:center;line-height:1.2}
.cell .dupadd,.cell .stepper,.cell .rodup{display:none}
.cell.mine.has:not(.dup) .dupadd{display:block}
.cell.mine.has.dup .stepper{display:flex}
.cell:not(.mine).dup .rodup{display:block}

.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty[hidden]{display:none}


/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(8,10,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:min(92vw,480px);max-height:78vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox p{color:#fff;margin:0;font-weight:700;text-align:center}
.lightbox button{background:#fff;color:#161A2C;border:0;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:.88rem;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:28px;font-size:.76rem;color:var(--muted);text-align:center}

button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media (min-width:640px){
  :root{--cellw:110px;--thumbw:92px;--gap:12px}
  h1{font-size:2rem}
  .info h3{font-size:1.05rem}
  .info .meta{font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  h.innerHTML = `${title} <span>${sub}, ${count} Karten</span>`;
  const box = document.createElement("div");
  list.append(h, box);
  secEls[key] = {h, box};
}
for (const c of CARDS){
  const [id, num, name, group, rarity, t1, t2, artist, sec] = c;
  const el = document.createElement("article");
  el.className = "card g-" + group;
  el.dataset.id = id;
  const hasImg = !id.startsWith("en-");
  const thumb = document.createElement(hasImg ? "button" : "div");
  thumb.className = "thumb";
  if (hasImg){ thumb.type = "button"; thumb.dataset.act = "zoom"; thumb.setAttribute("aria-label", `${name} groß anzeigen`); }
  thumb.style.setProperty("--t1", TYPE[t1] || TYPE.Trainer);
  thumb.style.setProperty("--t2", TYPE[t2 || t1] || TYPE.Trainer);
  const lbl = document.createElement("b");
  lbl.textContent = group === "energy" ? "E" : group === "promo" ? "P" : (num ? num.replace("/128","").replace("#","") : "?");
  thumb.append(lbl);
  if (hasImg){
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
    img.addEventListener("load", () => thumb.classList.add("loaded"));
    img.addEventListener("error", () => img.remove());
    img.src = IMG(c);
    thumb.append(img);
  }
  el.append(thumb);
  el.insertAdjacentHTML("beforeend", `<div class="info"><h3></h3><div class="meta"></div><div class="tags"><span class="tag r-${group}"></span><span class="tag upcoming" hidden></span><span class="tag trade" hidden></span></div></div>${cellHTML("a")}${cellHTML("b")}`);
  el.querySelector("h3").textContent = name;
  el.querySelector(".meta").textContent = (num ? (group === "cc" ? "Nr. " + num.slice(1) : num) + ", " : "") + "Illus. " + artist;
  el.querySelector(".tag.r-" + group).textContent = rarity;
  const upcoming = c[10];
  if (upcoming){ const u = el.querySelector(".tag.upcoming"); u.textContent = upcoming; u.hidden = false; }
  secEls[sec].box.append(el);
  rows.set(id, {el, c, cells:{a:el.querySelector('.cell[data-p="a"]'), b:el.querySelector('.cell[data-p="b"]')}, trade:el.querySelector(".tag.trade"), search:(num + " " + name + " " + artist + " " + rarity).toLowerCase()});
}

/* ---------- filters ---------- */
const STATUS = () => [["all","Alle"],["missMe",`Fehlt ${names[me]}`],["missOther",`Fehlt ${names[other()]}`],["missBoth","Fehlt beiden"],["trade","Tauschbar"]];
function renderStatus(){
  const s = $("#status"); s.innerHTML = "";
  for (const [k, label] of STATUS()){
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.status = k;
    b.setAttribute("aria-pressed", String(filt.status === k));
    b.textContent = label;
    const n = document.createElement("span"); n.className = "n"; n.id = "sc-" + k; b.append(n);
    s.append(b);
  }
}
for (const [k, label] of GROUPS){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (k === "pika" ? " pika" : ""); b.dataset.group = k;
  b.setAttribute("aria-pressed", "false");
  b.textContent = (k === "pika" ? "⚡ " : "") + label;
  $("#chips").append(b);
}

/* ---------- rendering ---------- */
function tradeDir(id){
  const A = cur("a", id), B = cur("b", id);
  if (A.dup > 0 && !B.have) return "ab";
  if (B.dup > 0 && !A.have) return "ba";
  return "";
}
function paintRow(r){
  const id = r.el.dataset.id;
  for (const p of ["a","b"]){
    const v = cur(p, id), cell = r.cells[p];
    cell.classList.toggle("mine", p === me);
    cell.classList.toggle("has", v.have);
    cell.classList.toggle("dup", v.have && v.dup > 0);
    const hb = cell.querySelector(".have");
    hb.setAttribute("aria-pressed", String(v.have));
    hb.setAttribute("aria-label", `${names[p]} hat ${r.c[2]} ${r.c[1]}`);
    cell.querySelector("output").textContent = v.dup + "×";
    cell.querySelector(".rodup").textContent = v.dup > 0 ? v.dup + "× doppelt" : "";
  }
  r.el.classList.toggle("miss-both", !cur("a", id).have && !cur("b", id).have);
  const d = tradeDir(id);
  const giver = d === "ab" ? "a" : d === "ba" ? "b" : null;
  r.trade.hidden = !giver;
  if (giver) r.trade.textContent = giver === me ? `⇄ an ${names[other()]} abgeben` : `⇄ von ${names[giver]} bekommen`;
}
function matches(r){
  const id = r.el.dataset.id;
  if (filt.groups.size && !filt.groups.has(r.c[3])) return false;
  if (filt.q && !r.search.includes(filt.q)) return false;
  const M = cur(me, id), O = cur(other(), id);
  switch (filt.status){
    case "missMe": return !M.have;
    case "missOther": return !O.have;
    case "missBoth": return !M.have && !O.have;
    case "trade": return !!tradeDir(id);
  }
  return true;
}
function refresh(){
  let shown = 0;
  const secCount = {};
  for (const r of rows.values()){
    paintRow(r);
    const vis = matches(r);
    r.el.hidden = !vis;
    if (vis){ shown++; secCount[r.c[8]] = (secCount[r.c[8]] || 0) + 1; }
  }
  for (const k in secEls) secEls[k].h.hidden = !secCount[k];
  $("#empty").hidden = shown > 0;
  $("#shown").textContent = shown === TOTAL ? `${TOTAL} Karten` : `${shown} von ${TOTAL}`;
  stats();
}
function stats(){
  const n = {a:0,b:0}, pk = {a:0,b:0}, cnt = {missMe:0, missOther:0, missBoth:0, trade:0};
  let give = 0, get = 0;
  for (const r of rows.values()){
    const id = r.el.dataset.id;
    for (const p of ["a","b"]) if (cur(p,id).have){ n[p]++; if (r.c[3] === "pika") pk[p]++; }
    const M = cur(me,id), O = cur(other(),id);
    if (!M.have) cnt.missMe++;
    if (!O.have) cnt.missOther++;
    if (!M.have && !O.have) cnt.missBoth++;
    const d = tradeDir(id);
    if (d){ cnt.trade++; ((d === "ab") === (me === "a")) ? give++ : get++; }
  }
  for (const p of ["a","b"]){
    const P = p.toUpperCase();
    $("#cnt"+P).textContent = `${n[p]}/${TOTAL}`;
    $("#bar"+P).style.width = (n[p] / TOTAL * 100) + "%";
    $("#sub"+P).textContent = `Pikachus ${pk[p]}/30, noch ${TOTAL - n[p]} offen`;
  }
  for (const k in cnt){ const e = document.getElementById("sc-" + k); if (e) e.textContent = cnt[k]; }
  const t = $("#tradeline");
  if (give || get){
    t.textContent = "";
    const g = document.createElement("b"); g.textContent = `${give} Karte${give === 1 ? "" : "n"} abgeben`;
    const h = document.createElement("b"); h.textContent = `${get} bekommen`;
    t.append("Du kannst ", g, " und ", h, `. Tausch mit ${names[other()]} anzeigen`);
  } else {
    t.textContent = "Noch keine Tauschmöglichkeit. Markiere Duplikate, dann erscheinen hier passende Karten.";
  }
}
function applyNames(){
  document.querySelectorAll(".nameA").forEach(e => e.textContent = names.a);
  document.querySelectorAll(".nameB").forEach(e => e.textContent = names.b);
  renderStatus(); refresh();
}
function applyMe(){
  document.querySelectorAll("[data-me]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === me)));
  document.querySelectorAll(".colhead .nm").forEach(e => e.classList.toggle("mine", e.dataset.p === me));
  renderStatus(); refresh();
}
function setStatus(mode, text){
  const el = $("#sync"); el.dataset.mode = mode;
  el.querySelector("span").textContent = text || {
    connecting:"Verbinde …", live:"Live synchronisiert",
    polling:"Verbunden, Aktualisierung alle 15 Sekunden"
  }[mode] || "";
}
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- data helpers ---------- */
function norm(v){ const have = !!v.have; return {have, dup: have ? Math.max(0, Math.min(99, Math.floor(Number(v.dup) || 0))) : 0}; }
function explain(err){
  const m = (err && (err.message || "")) + "";
  const code = err && err.code;
  if (/DataCloneError|can ?not be cloned|could not be cloned/i.test(m) || (err && err.name === "DataCloneError")) return PREVIEW_MSG;
  if (code === "42P01" || code === "PGRST205" || /does not exist|schema cache/i.test(m)) return "Tabellen fehlen. Bitte das SQL-Skript im Supabase SQL Editor ausführen.";
  if (/api key|jwt|apikey|unauthorized|401/i.test(m)) return "Der Key wird nicht akzeptiert. Bitte den Publishable Key (anon) prüfen.";
  if (/fetch|network|load failed/i.test(m)) return "Keine Verbindung zu Supabase. Project URL und Internetverbindung prüfen.";
  return "Fehler von Supabase: " + m;
}

/* ---------- writes ---------- */
function change(p, id, next){
  if (!sb){ toast("Noch keine Datenbank verbunden."); return; }
  pend[p][id] = next;
  paintRow(rows.get(id)); stats();
  schedule(p);
}
function schedule(p, ms = 450){
  clearTimeout(timers[p]);
  timers[p] = setTimeout(() => flush(p), ms);
}
async function flush(p){
  timers[p] = null;
  if (busy[p]){ schedule(p, 200); return; }
  if (!Object.keys(pend[p]).length) return;
  const batch = pend[p]; pend[p] = {}; infl[p] = batch; busy[p] = true;
  const payload = Object.entries(batch).map(([card_id, v]) => ({person:p, card_id, have:v.have, dup:v.have ? v.dup : 0}));
  let error = null;
  try { ({error} = await sb.from("tauschordner").upsert(payload, {onConflict:"person,card_id"})); }
  catch (e){ error = e; }
  if (error){
    pend[p] = Object.assign({}, batch, pend[p]);
    toast("Nicht gespeichert. " + explain(error) + " Neuer Versuch läuft.");
    infl[p] = {}; busy[p] = false;
    schedule(p, 4000 + Math.random() * 2000);
    return;
  }
  Object.assign(server[p], batch);
  infl[p] = {}; busy[p] = false;
  refresh();
}

/* ---------- reads + realtime ---------- */
async function loadAll(){
  if (!sb) return false;
  let r1;
  try { r1 = await sb.from("tauschordner").select("person,card_id,have,dup").limit(1000); } catch (e){ setStatus("error", explain(e)); return false; }
  if (r1.error){ setStatus("error", explain(r1.error)); return false; }
  const next = {a:{}, b:{}};
  for (const row of r1.data || []) if ((row.person === "a" || row.person === "b") && rows.has(row.card_id)) next[row.person][row.card_id] = norm(row);
  server.a = next.a; server.b = next.b;
  setStatus(live ? "live" : "polling");
  applyNames();
  return true;
}
function onRow(msg){
  const row = msg.new && msg.new.card_id ? msg.new : null;
  if (msg.eventType === "DELETE"){
    const o = msg.old || {};
    if ((o.person === "a" || o.person === "b") && server[o.person]) delete server[o.person][o.card_id];
  } else if (row && (row.person === "a" || row.person === "b") && rows.has(row.card_id)){
    server[row.person][row.card_id] = norm(row);
  } else return;
  refresh();
}
function connect(c){
  if (!window.supabase || typeof window.supabase.createClient !== "function"){
    setStatus("error", "Supabase-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen und neu laden.");
    return;
  }
  sb = window.supabase.createClient(c.url, c.key, {auth:{persistSession:false, autoRefreshToken:false}});
  setStatus("connecting");
  loadAll();
  channel = sb.channel("tauschordner-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"tauschordner"}, onRow)
    .subscribe(status => {
      if (status === "SUBSCRIBED"){ if (!live){ live = true; setStatus("live"); loadAll(); } }
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED"){ live = false; setStatus("polling"); }
    });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });
  pollT = setInterval(() => { if (!live && !document.hidden) loadAll(); }, 15000);
}

/* ---------- preview detection ---------- */
const PREVIEW_MSG = "Die Seite läuft gerade in einer Vorschau (z. B. in der Claude-App). Dort ist keine Verbindung zu Supabase möglich. Öffne sie über deinen eigenen Hosting-Link.";
function inPreview(){ try { return window.self !== window.top || location.protocol === "blob:" || location.protocol === "about:"; } catch (e){ return true; } }

/* ---------- events ---------- */
list.addEventListener("click", ev => {
  const btn = ev.target.closest("[data-act]"); if (!btn) return;
  const card = btn.closest(".card"), id = card.dataset.id;
  if (btn.dataset.act === "zoom"){ openLightbox(id); return; }
  const p = btn.closest(".cell").dataset.p;
  if (p !== me){ toast(`Das ist die Spalte von ${names[p]}. Oben bei "Ich bin" umschalten, um sie zu bearbeiten.`); return; }
  const v = cur(p, id);
  switch (btn.dataset.act){
    case "have": change(p, id, v.have ? {have:false, dup:0} : {have:true, dup:0}); break;
    case "dupadd": change(p, id, {have:true, dup:1}); break;
    case "dupplus": change(p, id, {have:true, dup:Math.min(99, v.dup + 1)}); break;
    case "dupminus": change(p, id, {have:true, dup:Math.max(0, v.dup - 1)}); break;
  }
});
function openLightbox(id){
  const r = rows.get(id);
  $("#lbImg").src = IMG_LARGE(r.c);
  $("#lbImg").alt = r.c[2];
  $("#lbCap").textContent = `${r.c[2]}, ${r.c[1] || ""} ${r.c[4]}`.replace(/\s+/g," ").trim();
  $("#lb").hidden = false;
  $("#lbClose").focus();
}
function closeLightbox(){ $("#lb").hidden = true; $("#lbImg").removeAttribute("src"); }
$("#lb").addEventListener("click", closeLightbox);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lb").hidden) closeLightbox(); });

document.querySelectorAll("[data-me]").forEach(b => b.addEventListener("click", () => {
  me = b.dataset.p;
  try { localStorage.setItem("tc30-me", me); } catch (e) {}
  applyMe();
}));
$("#status").addEventListener("click", ev => {
  const b = ev.target.closest("[data-status]"); if (!b) return;
  filt.status = b.dataset.status;
  document.querySelectorAll("[data-status]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  refresh();
});
$("#chips").addEventListener("click", ev => {
  const b = ev.target.closest("[data-group]"); if (!b) return;
  const k = b.dataset.group;
  filt.groups.has(k) ? filt.groups.delete(k) : filt.groups.add(k);
  b.setAttribute("aria-pressed", String(filt.groups.has(k)));
  refresh();
});
let qT;
$("#search").addEventListener("input", ev => {
  clearTimeout(qT);
  qT = setTimeout(() => { filt.q = ev.target.value.trim().toLowerCase(); refresh(); }, 150);
});
$("#tradeline").addEventListener("click", () => {
  filt.status = "trade"; renderStatus(); refresh();
  $("#list").scrollIntoView({behavior:"smooth", block:"start"});
});
$("#reset").addEventListener("click", () => {
  filt.status = "all"; filt.groups.clear(); filt.q = ""; $("#search").value = "";
  document.querySelectorAll("[data-group]").forEach(x => x.setAttribute("aria-pressed","false"));
  renderStatus(); refresh();
});

/* ---------- start ---------- */
applyMe(); applyNames();
if (inPreview()) setStatus("error", PREVIEW_MSG);
else connect(CONFIG);
</script>
</body>
</html>
